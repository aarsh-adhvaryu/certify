# Policy for the TEST SUITE. Independent of the project's, so tuning real
# budget ceilings cannot change what the tests assert.
#
# The rules that are cheap to enforce and expensive to get wrong live in code
# (path jail, guard-vs-verifier separation). Everything here is a value whose
# right setting is an empirical question, so it is configuration.
#
# There is no registry.toml beside this any more. It named a model, a base URL
# and prices for four roles, and the suite could not load without it — which is
# how, the moment a real key was bought, pytest started making billable calls.

[jail]
# Nothing the agent touches may live outside this root. Relative paths resolve
# against the project root.
root = "workspace"

[discovery]
# Where an agent may LOOK, as opposed to where it may write.
#
# Read-only by construction: `locate` answers where something is and how big it
# is, never what is in it.
#
# DENY BY DEFAULT — an empty list means nothing outside the workspace is
# reachable. The denylist always wins over anything added here, so putting your
# home directory in this list does not re-expose ~/.ssh.
roots = []
max_results = 200

# Omitted on purpose: `deny_dirs` and `deny_names` default to the shipped
# credential lists in guards/discovery.py (~/.ssh, ~/.aws, browser profiles,
# *.pem, id_rsa*, .env …). Setting either here REPLACES the default rather than
# adding to it, so an explicit `deny_names = []` genuinely disables that filter.

[execution]
# "windows" or "wsl:<distro>". Stage A.2 makes this portable.
backend = "windows"
command_timeout_seconds = 300.0

[ladder]
# Retry once with the failure reason appended, then stop. The cap is what makes
# a doomed task terminate rather than loop.
retries_before_escalation = 1
max_attempts = 4

[budget]
# Deterministic ceilings, checked BEFORE dispatch. Prompt discipline is not a
# mechanism.
per_task_usd = "0.50"
per_day_usd = "5.00"

[verify]
# Stateful checks quicker than the threshold are awaited inline; slower ones
# suspend the task to SQLite rather than sitting in a busy wait.
suspend_threshold_seconds = 2.0
poll_interval_seconds = 0.5
poll_timeout_seconds = 30.0

[refusal]
# Hand back a directive that asks for an improvement with no way to tell whether
# it arrived. On by default; over-refusing is the worse of the two failures, so
# this is configuration rather than a constant.
require_falsifiable_directive = true

[commands]
# Deny by default: an empty allowlist permits nothing. Only these executables
# may be run, and the path jail still applies to their working directory.
allow = ["python", "pytest", "git"]
