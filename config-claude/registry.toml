# CANDIDATE allocation for Slot 48d — execution on the Claude Code plane.
#
# Held in its own directory rather than swapped into `config/`, so the incumbent
# and the candidate are both reproducible and a comparison can be re-run without
# editing files back and forth:
#
#   python -m aop eval --label deepseek    --out evals\runs\deepseek.json
#   python -m aop eval --config config-claude --label claude_code \
#                      --out evals\runs\claude_code.json
#
# THE CONDUCTOR DOES NOT MOVE. It is called through the Adapter over HTTP, not
# through the execution plane, and it needs cheap frequent structured-JSON calls
# — the wrong shape for an agent loop. Only the three execution tiers change, so
# the comparison isolates the implementation loop and nothing else.
#
# Authorship also stays on the conductor (see policy.toml), for the same reason:
# it runs on the internal worker whichever plane is selected.

[roles.conductor]
provider = "openai"
model_id = "deepseek-v4-pro"
base_url = "https://api.deepseek.com"
api_key_ref = "DEEPSEEK_API_KEY"
price_in = "0.435"
price_out = "0.87"
price_cached_in = "0.003625"

[roles.conductor.params]
temperature = 0.2

[roles.conductor.capabilities]
context_window = 1000000
modality = "text"
tool_use = true
# Unverified for this provider. Left false so the shim strips the parameter
# rather than sending one the API may reject.
reasoning_effort = false
# DeepSeek caches prompt prefixes automatically. The cache-hit rate is 120x
# cheaper than a miss, which is why the stable-prefix ordering matters here more
# than anywhere else.
supports_caching = true



# ---------------------------------------------------------------------------
# Execution tiers — the Claude Code plane. No base_url and no api_key_ref: this
# is a local agent harness against the user's own subscription, so there is no
# endpoint to name and no credential of ours to send.
#
# Prices are omitted and therefore zero, which is what `Registry.is_free()`
# reports at flat rate. The spend ledger still records every call, so it goes
# quiet rather than blind — and wakes the instant failover moves to a paid vendor.
#
# `modality = "text"` is deliberate even though these models accept images: the
# plane does not send pixels yet, and claiming otherwise would route visual work
# somewhere it fails silently.
#
# THIS PLAN IS PRO (confirmed from ~/.claude/.credentials.json:
# claudeAiOauth.subscriptionType = "pro"), so all three rungs are Sonnet.
# Opus is not reliably available on Pro, and an escalation that failed on
# entitlement would look like a capability failure — a false datum about the
# plane rather than a true one about the model.
#
# Consequence for Slot 48d: this measures "Claude Code vs our tool loop",
# NOT "their ladder vs ours". Escalation then
# retries with the failure appended without actually getting stronger — the same
# honest limitation the DeepSeek phase carries, and it must not be mistaken for
# a working ladder.
# ---------------------------------------------------------------------------

[roles.low]
provider = "claude_code"
model_id = "claude-sonnet-5"

[roles.low.capabilities]
context_window = 200000
modality = "text"
tool_use = true
reasoning_effort = false
supports_caching = true

[roles.high]
provider = "claude_code"
model_id = "claude-sonnet-5"

[roles.high.capabilities]
context_window = 200000
modality = "text"
tool_use = true
reasoning_effort = false
supports_caching = true

[roles.max]
provider = "claude_code"
model_id = "claude-sonnet-5"

[roles.max.capabilities]
context_window = 200000
modality = "text"
tool_use = true
reasoning_effort = false
supports_caching = true
