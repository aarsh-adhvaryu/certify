# Model registry - the ONLY place a model name may appear.
#
# Code references role slots (conductor / low / high / max), never model names,
# so upgrading a model is an edit to this file rather than a code change
# (spec 3.1). Pricing and capability tags live here too, so a swap re-prices the
# cost model and re-targets the router automatically.
#
# API keys are referenced by environment-variable NAME, never pasted. The loader
# rejects anything that does not look like an env var name, so this file stays
# safe to commit.
#
# ---------------------------------------------------------------------------
# One vendor for the conductor; the execution tiers are the Claude Code plane.
#
# DeepSeek first because prompt tuning is where tokens burn - dozens of
# iterations getting the conductor to emit valid specs costs cents here and
# dollars at frontier rates, for identical learning.
#
# Prices verified 9 August 2026. DeepSeek announced an increase on 6 August with
# no figure given, and a 2x peak-hour surcharge (01:00-04:00 and 06:00-10:00 UTC)
# that was not yet active - re-check before trusting the cost model.
#
# KNOWN LIMITATION of this phase: one vendor means two real capability tiers, so
# `high` and `max` are the same model. Escalation between them retries with the
# failure appended but does not actually get stronger. That is honest for a
# wiring test and must not be mistaken for a working ladder.
#
# BOTH MODELS ARE TEXT-ONLY. Any task with needs_pixels will raise
# NoCapableTier. That is correct behaviour, and worth seeing once.
# ---------------------------------------------------------------------------

[roles.conductor]
provider = "openai"
model_id = "deepseek-v4-pro"
base_url = "https://api.deepseek.com"
api_key_ref = "DEEPSEEK_API_KEY"
price_in = "0.435"
price_out = "0.87"
price_cached_in = "0.003625"

[roles.conductor.params]
temperature = 0.2

[roles.conductor.capabilities]
context_window = 1000000
modality = "text"
tool_use = true
# Unverified for this provider. Left false so the shim strips the parameter
# rather than sending one the API may reject.
reasoning_effort = false
# DeepSeek caches prompt prefixes automatically. The cache-hit rate is 120x
# cheaper than a miss, which is why the stable-prefix ordering matters here more
# than anywhere else.
supports_caching = true


# ---------------------------------------------------------------------------
# Execution tiers — Claude Code preferred, DeepSeek underneath.
#
# THE SPLIT IS THE POINT. The conductor stays on DeepSeek: it plans, it talks,
# and it is ~60% of a task's bill (3,605 output tokens for planning against 338
# for the work). Claude Code is excellent at the coding and expensive as a
# conversationalist, so it gets the coding and nothing else.
#
# `fallback` is the sideways move for FailureClass.TRANSPORT — quota saturated,
# credit gone, wire dead. Never for a verifier failure: that climbs the ladder
# instead. When the subscription runs out mid-task the tier steps to DeepSeek
# and *the plane steps with it* (Slot 49) — a claude_code vendor and an HTTP
# vendor do not live on the same plane, and before 49 only the model id moved.
#
# Prices are omitted on the claude_code entries and therefore zero, which is what
# `Registry.is_free()` reports at flat rate. The ledger still records every call
# — quiet, not blind — and wakes the moment a fallback spends real money.
#
# THE PLAN IS PRO, so all three rungs are Sonnet. Escalation therefore retries
# with the failure appended rather than actually getting stronger. That is
# honest, not a working ladder — see the open findings in CLAUDE.md.
# ---------------------------------------------------------------------------

[roles.low]
provider = "claude_code"
model_id = "claude-sonnet-5"

[roles.low.capabilities]
context_window = 200000
modality = "text"
tool_use = true
reasoning_effort = false
supports_caching = true

# Sideways when the subscription saturates. Same strength, different vendor —
# and a different execution plane, which is what Slot 49 made work.
[[roles.low.fallback]]
provider = "openai"
model_id = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
api_key_ref = "DEEPSEEK_API_KEY"
price_in = "0.14"
price_out = "0.28"
price_cached_in = "0.0028"

[roles.low.fallback.params]
temperature = 0.0

[roles.low.fallback.capabilities]
context_window = 1000000
modality = "text"
tool_use = true
reasoning_effort = false
supports_caching = true


