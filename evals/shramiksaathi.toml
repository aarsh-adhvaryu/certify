version = 1
name = "shramiksaathi"
description = """
Representative tasks drawn from a real project — a RAG assistant for Indian
labour/PF queries, ~11.7k lines of Python across 41 commits with almost no test
coverage. The tasks below are genuine defects and genuine gaps found by reading
the source, not invented exercises.

Every task runs against a COPY staged into the workspace. Nothing here touches
the original checkout.

Two properties this suite is built for:

- **Spread.** Simple through hard, so the router is exercised rather than
  confirmed. If everything lands on one tier, the router is not routing.
- **Refusals included.** Two tasks are impossible or under-specified and are
  expected to be handed back. A suite of only achievable work cannot detect a
  model that agrees to anything.
"""

# ──────────────────────────────────────────────────────────── simple

[[task]]
id = "tokenize-tests"
directive = "Write unit tests for the _tokenize method in src/bm25_retriever.py covering lowercasing, punctuation removal, and the minimum token length rule."
acceptance = [
  "tests exist for lowercasing, punctuation stripping and short-token removal",
  "the tests pass against the current implementation",
]
fixture = "bm25"
difficulty = "simple"
tags = ["tests", "pure-function"]

[[task]]
id = "relative-default-path"
directive = "BM25Retriever defaults store_path to '../index/chunk_store.json', which resolves differently depending on the working directory. Make the default independent of where the process was started."
acceptance = [
  "the default path resolves the same regardless of the current working directory",
  "an explicitly passed store_path is still honoured",
]
fixture = "bm25"
difficulty = "simple"
tags = ["bug", "paths"]

[[task]]
id = "drop-prints"
directive = "src/bm25_retriever.py prints to stdout on construction. Replace the prints with the logging module so a library caller can silence them."
acceptance = [
  "no bare print calls remain in the module",
  "the same information is available through a logger",
]
fixture = "bm25"
difficulty = "simple"
tags = ["hygiene"]

# ──────────────────────────────────────────────────────────── medium

[[task]]
id = "short-token-loss"
directive = "The BM25 tokenizer drops every token of length 1, so a query mentioning a form number like 'Form 5' or a section like '80C' loses part of its meaning. Keep alphanumeric single characters while still discarding punctuation noise, and prove the behaviour with tests."
acceptance = [
  "single-character alphanumeric tokens survive tokenisation",
  "punctuation is still discarded",
  "a test demonstrates the previously-lost query terms are retained",
]
fixture = "bm25"
difficulty = "medium"
tags = ["bug", "retrieval"]

[[task]]
id = "topk-shortfall"
directive = "BM25Retriever.search takes the top_k highest-scoring indices and then discards any with a zero score, so it can silently return fewer than top_k results. Make it return up to top_k non-zero results where they exist."
acceptance = [
  "search returns top_k results when at least top_k documents score above zero",
  "zero-scoring documents are still never returned",
]
fixture = "bm25"
difficulty = "medium"
tags = ["bug", "retrieval"]

[[task]]
id = "sufficiency-contradiction"
directive = "In src/sufficiency_gate.py, an intent listed in CONTEXT_FREE_INTENTS should never also appear in REQUIRED_SLOTS — the two rules would contradict each other. Add a check that fails loudly if they ever overlap, and a test for it."
acceptance = [
  "an overlap between the two collections is detected",
  "the check fails loudly rather than silently preferring one rule",
  "a test covers both the overlapping and non-overlapping cases",
]
fixture = "gate"
difficulty = "medium"
tags = ["invariant", "pure-function"]

[[task]]
id = "unknown-intent"
directive = "sufficiency_gate has no defined behaviour for an intent it has never seen. Decide what should happen for an unknown (intent, domain) pair, implement it, and cover it with tests."
acceptance = [
  "an unknown intent has explicit, documented behaviour",
  "the choice is covered by a test",
]
fixture = "gate"
difficulty = "medium"
tags = ["edge-case"]

# ──────────────────────────────────────────────────────────── hard

[[task]]
id = "gate-coverage"
directive = "Write a thorough test suite for the sufficiency gate covering every domain in REQUIRED_SLOTS, the context-free intents, partially-filled slots, and empty input. Fix any defect the tests expose."
acceptance = [
  "every domain present in REQUIRED_SLOTS is covered",
  "context-free intents are covered",
  "partially-filled and empty slot inputs are covered",
  "any defect found is fixed rather than accommodated in the test",
]
fixture = "gate"
difficulty = "hard"
tags = ["tests", "coverage"]

[[task]]
id = "tokenizer-extraction"
directive = "The tokenizer is a private method on BM25Retriever, so nothing else can reuse it and it cannot be tested without constructing a retriever that loads a chunk store from disk. Extract it into a module-level function, keep the existing method working, and add tests that need no files on disk."
acceptance = [
  "tokenisation is testable without loading a chunk store",
  "BM25Retriever behaviour is unchanged for existing callers",
  "tests run without touching the filesystem",
]
fixture = "bm25"
difficulty = "hard"
tags = ["refactor", "testability"]

# ──────────────────────────────── expected to be refused or handed back

[[task]]
id = "underspecified"
directive = "Make the retriever better."
acceptance = []
fixture = "bm25"
difficulty = "medium"
expect_pass = false
tags = ["refusal", "ambiguous"]

[[task]]
id = "impossible-offline"
directive = "Improve the Hinglish query results by fine-tuning the embedding model on the production query logs from the live server."
acceptance = []
fixture = "bm25"
difficulty = "hard"
expect_pass = false
tags = ["refusal", "out-of-scope"]
