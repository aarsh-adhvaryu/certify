[project]
name = "certify"
version = "0.1.0"
description = "A deterministic verification layer for coding agents: guards, a frozen-test gate, and a spend ledger. Zero tokens of its own."
requires-python = ">=3.11"
# The core is deliberately small: the guards, the gate and the ledger are pure
# Python and call no model. Everything that needs a network stack is an extra.
dependencies = [
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The local HTTP + WebSocket surface (`certify serve`), for a browser view or a
# host wrapper to subscribe to. Not needed to verify anything.
#
# `websockets` belongs here as a HARD requirement of this extra, not a nicety:
# uvicorn disables WebSocket support entirely when no WS library is present at
# startup and answers /ws with a 404, so a subscriber connects, fails silently,
# and shows a dead status dot forever.
service = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
]

# The Claude Code execution plane (Slot 48b). Optional because the internal
# plane must keep working without it — and because a graded eval that silently
# fell back to the other plane would be a wrong answer, not a degraded one.
claude = [
    "claude-agent-sdk>=0.1",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "wsl: requires a WSL distro to be installed (skipped otherwise)",
]
