[project]
name = "certify"
version = "0.1.0"
description = "Stop your coding agent grading its own homework. A deterministic verification layer: refuses unfalsifiable work, freezes the criteria before implementation, and calls no model to do it."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aarsh Adhvaryu" }]
keywords = [
    "coding-agent",
    "verification",
    "llm",
    "static-analysis",
    "ci",
    "claude-code",
    "guardrails",
]

# Two packages. That is the point, not an accident.
#
# Everything that decides whether work is acceptable calls no model, so there is
# no HTTP client, no provider SDK and no API key anywhere in the core. httpx was
# a dependency until slot 0.2, when the model layer that needed it was removed;
# nothing has imported it since.
dependencies = [
    "pydantic>=2.7",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

# Deliberately absent, and worth stating so they are not re-added by reflex:
#
#   service — the local HTTP + WebSocket surface. Deleted in slot 0.1; Stage I
#             rebuilds it as a client of state that never imports the core.
#   claude  — the Claude Agent SDK. hosts/claude_code.py builds a hook payload as
#             a plain dict and does not import the SDK to do it. Stage E.3 wires
#             it to a real host, and that is when the extra earns its place.
#   graph   — `graphifyy`, for Stage F. Reading graph.json needs no dependency at
#             all; the extra will exist only to *produce* one.

[project.urls]
Repository = "https://github.com/aarsh-adhvaryu/certify"
Issues = "https://github.com/aarsh-adhvaryu/certify/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "wsl: requires a WSL distro to be installed (skipped otherwise)",
]
